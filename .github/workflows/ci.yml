name: CI - Verificação de Pull Request

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificação (Lint, Build e Testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática (Lint)
        run: npm run lint

      - name: Compilação e Typecheck (Build)
        run: npm run build

      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar testes de UI/Operação
        run: npm run test:ui
        env:
          CI: true

      - name: Upload de relatórios de falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
